docx:
  title: "Predicción de Precios de Viviendas con Regresión Lineal"
  activity: "Actividad de Machine Learning I: del análisis exploratorio al despliegue con Streamlit"
  group: "Feibert Alirio Guzmán Pérez"
  discipline: "Ingeniería de Sistemas / Ciencia de Datos e IA"
  project_name: "Housing Price ML"
  intro: "El presente proyecto aborda la predicción del valor mediano de una vivienda en California a partir de variables geográficas, demográficas y socioeconómicas. A través de un flujo CRISP-ML(Q), se integran el análisis exploratorio, la limpieza de datos, la regresión lineal simple y múltiple, la evaluación con métricas y el despliegue de una aplicación interactiva en Streamlit. El propósito es demostrar, con un caso real y reproducible, cómo un modelo supervisado puede convertir datos abiertos en una herramienta de consulta comprensible para docentes, estudiantes y analistas."
  antecedente: "El mercado inmobiliario genera grandes volúmenes de datos, pero su aprovechamiento suele limitarse a reportes descriptivos. La estimación del precio de una vivienda requiere integrar variables de ubicación, tamaño, antigüedad y nivel socioeconómico. Sin un proceso estructurado, los análisis quedan fragmentados y no permiten comparar escenarios ni comunicar resultados con transparencia. Este proyecto propone un flujo completo que va desde la exploración del dataset California Housing hasta un simulador interactivo, con énfasis en la interpretación de métricas y en los límites del modelo."
  target_text: "Variable objetivo: median_house_value. Es una variable numérica continua que representa el valor mediano de la vivienda en dólares. El modelo busca estimarla a partir de ocho variables numéricas: longitud, latitud, edad mediana, habitaciones, dormitorios, población, hogares e ingreso mediano."
  features_text: "Variables independientes: longitude, latitude, housing_median_age, total_rooms, total_bedrooms, population, households y median_income. La variable ocean_proximity se excluye del modelo lineal porque es categórica; su inclusión requeriría codificación adicional."
  question_text: "¿En qué medida un modelo de regresión lineal, entrenado con variables geográficas, demográficas y socioeconómicas, permite estimar el valor mediano de una vivienda y comunicar sus resultados de forma comprensible mediante una aplicación interactiva?"
  impact_text: "El proyecto impacta a docentes y estudiantes que necesitan un ejemplo completo de Machine Learning, a analistas que desean interpretar el efecto de las variables socioeconómicas y a ciudadanos que requieren una estimación orientativa y transparente. El simulador no sustituye un avalúo profesional; su valor es formativo y exploratorio."
  model_justification: "Se elige regresión lineal porque la variable objetivo es continua y el objetivo es interpretar coeficientes, no solo maximizar precisión. El modelo simple permite explicar la relación entre ingreso y precio; el modelo múltiple incorpora ubicación, tamaño y estructura del hogar. La comparación entre ambos evidencia el valor de incorporar más información y también los límites de un modelo lineal."
  architecture_text: "La arquitectura se organiza en capas: datos, preparación, modelado, evaluación, despliegue y documentación. El CSV se carga con pandas; la limpieza y la imputación se realizan antes del EDA; scikit-learn entrena los modelos; las métricas se calculan sobre el conjunto de prueba; Streamlit publica el simulador; y GitHub Pages aloja la landing documental. Esta separación permite reproducir, auditar y mantener cada componente."
  etl_text: "El proceso ETL se adapta a un dataset único: Extract lee housing.csv; Transform imputa total_bedrooms con la mediana, revisa tipos, elimina ocean_proximity para el modelo y separa variables; Load deja el DataFrame limpio disponible para el EDA, el entrenamiento y la aplicación. Aunque el proyecto no consume APIs, el flujo conserva la lógica de calidad de datos de CRISP-ML(Q)."
  eda_text: "El EDA muestra que median_income es la variable más correlacionada con el precio. La visualización geográfica evidencia que la costa y las áreas metropolitanas concentran valores más altos. También se identifican valores atípicos en habitaciones, población y hogares, y un efecto techo en 500,001 dólares. Estos hallazgos orientan la selección de variables y la interpretación de los resultados."
  ethics:
    - aspect: "Privacidad y protección de datos"
      approach: "Se utilizan datos públicos agregados por bloque censal. No se incorporan datos personales ni identificadores individuales. Cualquier uso futuro con datos institucionales requeriría anonimización y cumplimiento normativo."
      applies: "Sí"
    - aspect: "Sesgo y representatividad"
      approach: "Se reconoce que el dataset corresponde a California en 1990 y puede no representar otros territorios o periodos. Se documentan las limitaciones y se evita presentar el modelo como predictor universal."
      applies: "Sí"
    - aspect: "Transparencia y explicabilidad"
      approach: "Se publican coeficientes, métricas y limitaciones. La app muestra el resultado y advierte que es una estimación académica. No se oculta el error del modelo."
      applies: "Sí"
    - aspect: "Riesgo de estigmatización"
      approach: "No se clasifican personas ni comunidades como buenas o malas. Las variables geográficas se interpretan como contexto agregado, no como juicio sobre sus habitantes."
      applies: "Sí"
    - aspect: "Supervisión humana"
      approach: "Las predicciones son de apoyo. Cualquier decisión inmobiliaria o financiera debe ser validada por profesionales y por la persona usuaria."
      applies: "Sí"
  risks:
    - "Sobreajuste o interpretación causal incorrecta de los coeficientes."
    - "Datos desactualizados o no representativos del mercado actual."
    - "Valores atípicos y efecto techo en la variable objetivo."
    - "Uso indebido del simulador como avalúo profesional."
  mitigations:
    - "División entrenamiento/prueba y reporte de métricas en datos no vistos."
    - "Documentación explícita de la fuente, fecha y limitaciones del dataset."
    - "Análisis de valores atípicos y nota sobre el límite de 500,001 dólares."
    - "Aviso visible en la landing y en la app sobre el carácter académico."
  pitch:
