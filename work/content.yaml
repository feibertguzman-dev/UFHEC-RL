dataset:
  name: "California Housing"
  file: "housing.csv"
  source: "U.S. Census Bureau (1990), distribuido por StatLib y disponible en scikit-learn"
  source_url: "https://scikit-learn.org/stable/datasets/real_world.html#california-housing-dataset"
  license: "Uso académico y educativo; datos públicos agregados"
  rows: 20640
  columns_count: 10
  target: "median_house_value"
  features:
    - "longitude"
    - "latitude"
    - "housing_median_age"
    - "total_rooms"
    - "total_bedrooms"
    - "population"
    - "households"
    - "median_income"
  categorical:
    - "ocean_proximity"
  missing_total: 207
  missing_column: "total_bedrooms"
  rows_train: 16512
  rows_test: 4128
  target_stats:
    min: 14999.0
    max: 500001.0
    mean: 206855.82
    median: 179700.0
  ranges:
    longitude: [-124.35, -114.31, -118.49]
    latitude: [32.54, 41.95, 34.26]
    housing_median_age: [1.0, 52.0, 29.0]
    total_rooms: [2.0, 39320.0, 2127.0]
    total_bedrooms: [1.0, 6445.0, 435.0]
    population: [3.0, 35682.0, 1166.0]
    households: [1.0, 6082.0, 409.0]
    median_income: [0.4999, 15.0001, 3.5348]
  variables:
    - name: "longitude"
      type: "Numérica continua"
      description: "Longitud geográfica del bloque de viviendas."
      role: "Feature"
    - name: "latitude"
      type: "Numérica continua"
      description: "Latitud geográfica del bloque de viviendas."
      role: "Feature"
    - name: "housing_median_age"
      type: "Numérica discreta"
      description: "Edad mediana de las viviendas del bloque."
      role: "Feature"
    - name: "total_rooms"
      type: "Numérica discreta"
      description: "Total de habitaciones en el bloque."
      role: "Feature"
    - name: "total_bedrooms"
      type: "Numérica discreta"
      description: "Total de dormitorios en el bloque. Presenta 207 valores nulos."
      role: "Feature"
    - name: "population"
      type: "Numérica discreta"
      description: "Población del bloque."
      role: "Feature"
    - name: "households"
      type: "Numérica discreta"
      description: "Número de hogares en el bloque."
      role: "Feature"
    - name: "median_income"
      type: "Numérica continua"
      description: "Ingreso mediano de los hogares, expresado en decenas de miles de dólares."
      role: "Feature principal"
    - name: "median_house_value"
      type: "Numérica continua"
      description: "Valor mediano de la vivienda. Es la variable objetivo. Está acotada en 500,001 dólares."
      role: "Target"
    - name: "ocean_proximity"
      type: "Categórica"
      description: "Proximidad al océano. Se excluye del modelo lineal para trabajar solo con variables numéricas."
      role: "Excluida"
  notes: "Los datos son agregados por bloque censal, no por vivienda individual. El valor máximo está censurado en 500,001 dólares, lo que limita las predicciones en la zona alta del mercado."

problem:
  context: "El precio de una vivienda depende de factores físicos, geográficos y socioeconómicos que interactúan entre sí. Estimar ese valor con precisión es difícil para compradores, vendedores, analistas y ciudadanos que no son especialistas en modelos predictivos."
  question: "¿Cómo predecir el valor mediano de una vivienda en California a partir de variables geográficas, demográficas y socioeconómicas, usando regresión lineal simple y múltiple?"
  objective_general: "Desarrollar y desplegar un modelo de regresión lineal que estime el valor mediano de una vivienda y lo ponga a disposición mediante una landing page y un simulador interactivo en Streamlit."
  objectives:
    - "Comprender el problema y el diccionario de variables del dataset California Housing."
    - "Realizar análisis exploratorio, limpieza e imputación de valores faltantes."
    - "Entrenar un modelo de regresión lineal simple usando median_income."
    - "Entrenar un modelo de regresión lineal múltiple con las variables numéricas disponibles."
    - "Evaluar los modelos con MSE, RMSE, MAE y R²."
    - "Publicar una landing page documental y una aplicación Streamlit para simular predicciones."
  impact:
    - "Docentes y estudiantes que necesitan un ejemplo completo y reproducible de Machine Learning."
    - "Analistas que buscan interpretar el efecto de variables socioeconómicas sobre el precio."
    - "Ciudadanos que requieren una estimación orientativa y transparente."
  scope: "El proyecto es académico y exploratorio. No sustituye un avalúo profesional ni una decisión financiera."

theory:
  intro: "La regresión lineal es un algoritmo supervisado que aprende una relación lineal entre una o varias variables de entrada y una variable continua de salida. El modelo busca la recta o hiperplano que minimiza la suma de errores al cuadrado."
  simple: "La regresión simple usa una sola variable independiente: y = β0 + β1x. En este proyecto se utiliza median_income para estimar median_house_value."
  multiple: "La regresión múltiple usa varias variables: y = β0 + β1x1 + ... + βnxn. Permite controlar el efecto conjunto de ubicación, edad, tamaño y características socioeconómicas."
  metrics:
    - name: "MSE"
      description: "Error cuadrático medio. Penaliza con fuerza los errores grandes; cuanto más cercano a 0, mejor."
    - name: "RMSE"
      description: "Raíz del MSE. Se expresa en la misma unidad que la variable objetivo (dólares)."
    - name: "MAE"
      description: "Error absoluto medio. Indica cuánto se desvía, en promedio, la predicción del valor real."
    - name: "R²"
      description: "Proporción de la variabilidad del precio explicada por el modelo. Un valor de 0.6139 equivale a 61.39%."
  assumptions:
    - "Relación aproximadamente lineal entre las variables."
    - "Independencia de los errores y varianza constante."
    - "Ausencia de multicolinealidad severa entre predictores."
    - "Datos representativos del fenómeno que se quiere predecir."

methodology:
  framework: "CRISP-ML(Q)"
  intro: "El proyecto sigue una adaptación de CRISP-ML(Q), un marco de trabajo que incorpora la calidad de los datos y del modelo en cada fase del ciclo de vida."
  phases:
    - number: "01"
      name: "Comprensión del problema"
      detail: "Se define el objetivo, la variable objetivo, las métricas y el alcance académico."
    - number: "02"
      name: "Comprensión y preparación de datos"
      detail: "Se carga el CSV, se revisan tipos y nulos, se imputa total_bedrooms y se excluye ocean_proximity."
    - number: "03"
      name: "Análisis exploratorio"
      detail: "Se estudian distribuciones, correlaciones, valores atípicos y patrones geográficos."
    - number: "04"
      name: "Modelado"
      detail: "Se entrenan regresión simple y múltiple con scikit-learn y una división 80/20."
    - number: "05"
      name: "Evaluación"
      detail: "Se comparan MSE, RMSE, MAE y R² sobre el conjunto de prueba."
    - number: "06"
      name: "Despliegue y monitoreo"
      detail: "Se publica la landing page y la app Streamlit, dejando documentados los límites y la reproducibilidad."

eda:
  intro: "El análisis exploratorio permite entender la calidad de los datos, la relación entre variables y los patrones geográficos antes de entrenar el modelo."
  insights:
    - "median_income es la variable con mayor correlación positiva con median_house_value."
    - "La ubicación geográfica explica parte importante del precio: la costa y las áreas metropolitanas concentran valores más altos."
    - "total_bedrooms tiene 207 valores nulos; se imputan con la mediana para no perder registros."
    - "La variable objetivo está acotada en 500,001 dólares, lo que genera un efecto techo en las predicciones."
    - "Existen valores atípicos en total_rooms, population y households que deben interpretarse con cautela."
  figures:
    - file: "correlation-heatmap.png"
      title: "Matriz de correlación"
      caption: "Relaciones lineales entre las variables numéricas del dataset."
    - file: "geographic-map.png"
      title: "Distribución geográfica"
      caption: "Precio mediano por ubicación; el color representa el valor de la vivienda."
    - file: "simple-regression.png"
      title: "Regresión simple"
      caption: "Relación entre el ingreso mediano y el valor mediano de la vivienda."
    - file: "target-distribution.png"
      title: "Distribución del precio"
      caption: "Histograma de median_house_value y su concentración en el rango medio."

models:
  simple:
    equation: "median_house_value = 45,085.58 + 41,793.85 × median_income"
    intercept: 45085.58
    coef: 41793.85
    interpretation: "Por cada aumento de una unidad en median_income (10,000 dólares de ingreso mediano), el modelo estima un incremento promedio de 41,793.85 dólares en el valor de la vivienda."
  multiple:
    metrics:
      mse: 5059928371.17
      rmse: 71133.17
      mae: 51810.48
      r2: 0.6139
    intercept: -3578224.23
    interpretation: "El modelo múltiple explica aproximadamente el 61.39% de la variabilidad del precio en el conjunto de prueba. El error promedio absoluto es de 51,810.48 dólares y el RMSE de 71,133.17 dólares."
    coefficients:
      - name: "median_income"
        value: 40538.40
        reading: "A mayor ingreso mediano, mayor precio esperado."
      - name: "longitude"
        value: -42632.39
        reading: "El signo refleja el efecto geográfico agregado; no debe interpretarse de forma causal aislada."
      - name: "latitude"
        value: -42450.07
        reading: "El signo refleja el efecto geográfico agregado; no debe interpretarse de forma causal aislada."
      - name: "housing_median_age"
        value: 1182.81
        reading: "Viviendas más antiguas se asocian, en promedio, con un valor ligeramente mayor en este dataset."
      - name: "total_rooms"
        value: -8.19
        reading: "Efecto marginal pequeño y sensible a la escala del bloque."
      - name: "total_bedrooms"
        value: 116.26
        reading: "Efecto marginal positivo después de controlar las demás variables."
      - name: "population"
        value: -38.49
        reading: "Efecto marginal negativo pequeño."
      - name: "households"
        value: 46.34
        reading: "Efecto marginal positivo pequeño."
  comparison: "El modelo múltiple mejora la capacidad explicativa frente a la regresión simple, pero sigue dejando fuera relaciones no lineales y variables categóricas como ocean_proximity."
  limitations:
    - "La regresión lineal supone relaciones lineales que no siempre se cumplen."
    - "El dataset es agregado por bloque censal y corresponde a 1990; no refleja el mercado actual."
    - "El valor máximo está censurado en 500,001 dólares."
    - "No se incluyen variables categóricas ni interacciones."
    - "Las predicciones son estimaciones académicas, no avalúos profesionales."

